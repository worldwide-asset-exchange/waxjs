<!DOCTYPE html>
<html>

<script src='waxjs.js'></script>

<title>waxjs demo</title>

<body>

<h1>wax signing lib demo and tester</h1>

<p>As well as being a demo, this is used by the test cases in the test folder.</p>

<p>This sample dapp operates the <b>test.wax</b> contract's <b>update</b> action.</p>

<p>The source code for this contract can be found in the resources/test-contract folder.</p>

<p>Click the buttons</p>

<button id="login" onclick=login() >WAX Login</button><br><br>
<hr>
<label>updater:</label><input id="updater"><br><br>
<label>message:</label><input id="message"><br><br>
<label>fail:</label><input type="checkbox" id="fail" value="fail"><br><br>
<button id="sign" onclick=sign() >Sign transaction</button><br><br>
<label>Current Message</label><h3 id="current"></h3><br><br>
<hr>
<hr>
<label>miner:</label><input id="miner"><br><br>
<label>nonce:</label><input id="nonce"><br><br>
<label>notify:</label><input id="notify"><br><br>
<button id="mine" onclick=mine() >AlienWorld mine</button><br><br>
<hr>
<hr>
<label>account:</label><input id="setbagAccount"><br><br>
<label>items:</label><input id="setbagItems"><br><br>
<button id="setbag" onclick=setbag() >AlienWorld setbag</button><br><br>
<hr>
<label>loop account:</label><input id="loopAccount"><br><br>
<label>loop count:</label><input id="loopCount" type="number" value="1"><br><br>
<button id="loop" onclick=loop() >Call Loop Action</button><br><br>
<hr>
<button id="proof" onclick=proof() >Proof</button><br><br>
<hr>
<label>Transaction Results</label>
<h2 id="response"></h2>

<script>
  // const wax = new waxjs.WaxJS({
  //   rpcEndpoint: 'https://wax.greymass.com',
  //   chainId: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4'
  // });
  const wax = new waxjs.WaxJS({
    rpcEndpoint: 'http://stg-chain.waxstg.net',
    waxSigningURL: 'https://stg-wallet-ui.waxstg.net',
    waxAutoSigningURL: 'https://stg-api-idm.waxstg.net/v1/accounts/auto-accept'
  });

  async function login() {
    try {
      const userAccount = await wax.login();
      document.getElementById('updater').value = userAccount;
      await getCurrentMessage();
    } catch(e) {
      document.getElementById('response').append(e.message);
    }
  }

  async function sign() {
    if(!wax.api) {
      return document.getElementById('response').append('* Login first *');
    }

    const updater = document.getElementById('updater').value;
    const message = document.getElementById('message').value;
    const fail = document.getElementById('fail').checked;

    try {
      const result = await wax.api.transact({
        actions: [{
          account: 'test.wax',
          name: 'update',
          authorization: [{
            actor: wax.userAccount,
            permission: 'active',
          }],
          data: {
            updater,
            message,
            fail,
          },
        }]
      }, {
        blocksBehind: 3,
        expireSeconds: 30
      });
      document.getElementById('response').append(JSON.stringify(result));
      await new Promise(resolve => setTimeout(resolve, 1000));
      await getCurrentMessage();
    } catch(e) {
      document.getElementById('response').append(e.message);
    }
  }

  async function mine() {
    if(!wax.api) {
      return document.getElementById('response').append('* Login first *');
    }

    const miner = document.getElementById('miner').value;
    const nonce = document.getElementById('nonce').value;
    const notify = document.getElementById('notify').value;

    try {
      const result = await wax.api.transact({
        actions: [{
          account: 'm.federation',
          name: 'mine',
          authorization: [{
            actor: wax.userAccount,
            permission: 'active',
          }],
          data: {
            miner,
            nonce,
            notify,
          },
        }]
      }, {
        blocksBehind: 3,
        expireSeconds: 30
      });
      document.getElementById('response').append(JSON.stringify(result));
      await new Promise(resolve => setTimeout(resolve, 1000));
      await getCurrentMessage();
    } catch(e) {
      document.getElementById('response').append(e.message);
    }
  }

  async function setbag() {
    if(!wax.api) {
      return document.getElementById('response').append('* Login first *');
    }

    const account = document.getElementById('setbagAccount').value;
    const items = document.getElementById('setbagItems').value.split(',').map(Number);

    try {
      const result = await wax.api.transact({
        actions: [{
          account: 'm.federation',
          name: 'setbag',
          authorization: [{
            actor: wax.userAccount,
            permission: 'active',
          }],
          data: {
            account,
            items,
          },
        }]
      }, {
        blocksBehind: 3,
        expireSeconds: 30
      });
      document.getElementById('response').append(JSON.stringify(result));
      await new Promise(resolve => setTimeout(resolve, 1000));
      await getCurrentMessage();
    } catch(e) {
      document.getElementById('response').append(e.message);
    }
  }

  async function loop() {
    if(!wax.api) {
      return document.getElementById('response').append('* Login first *');
    }

    const account = document.getElementById('loopAccount').value;
    const count = parseInt(document.getElementById('loopCount').value);

    try {
      const result = await wax.api.transact({
        actions: [{
          account: 'm.federation',
          name: 'loop',
          authorization: [{
            actor: wax.userAccount,
            permission: 'active',
          }],
          data: {
            looper:account,
            count,
          },
        }]
      }, {
        blocksBehind: 3,
        expireSeconds: 30
      });
      document.getElementById('response').append(JSON.stringify(result));
      await new Promise(resolve => setTimeout(resolve, 1000));
      await getCurrentMessage();
    } catch(e) {
      document.getElementById('response').append(e.message);
    }
  }

  async function getCurrentMessage() {
    const res = await wax.rpc.get_table_rows({
      json: true,
      code: 'test.wax',
      scope: 'test.wax',
      table: 'messages',
      lower_bound: wax.userAccount,
      upper_bound: wax.userAccount,
    });

    const message = res.rows[0] ? res.rows[0].message : `<No message is set for ${wax.userAccount}>`;
    document.getElementById('current').textContent = message;
  }

  // set a random value to the initial message value
  document.getElementById('message').value = Math.random().toString(36).substring(2);

</script>
</body>
</html>
